<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Sand</title>

<style>
  :root { --ink: #f3eee6; --glass: rgba(18, 16, 14, 0.62); --line: rgba(255, 255, 255, 0.11);
          --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
  html { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; position: fixed; inset: 0; overflow: hidden; background: #000; touch-action: none; overscroll-behavior: none;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  * { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 2px; }
  #stage { position: fixed; inset: 0; overflow: hidden; contain: strict; }
  #c { position: absolute; left: 0; top: 0; display: block; transform-origin: 50% 50%; touch-action: none; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
           box-shadow: 0 0 0 .5px var(--line) inset, 0 10px 40px rgba(0, 0, 0, .35); }

  /* menu button: 48px hit area, small smoked dot cluster that fades back when idle */
  #menuBtn { position: fixed; z-index: 5; top: calc(var(--sat) + 6px); right: calc(var(--sar) + 6px); width: 48px; height: 48px;
             padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; opacity: .9; transition: opacity .8s; }
  #menuBtn.idle { opacity: .62; }
  #menuBtn:active { opacity: 1; transition: none; }
  #menuBtn span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
                  background: rgba(12, 10, 8, .58); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 0 0 .5px rgba(255, 255, 255, .18) inset, 0 1px 6px rgba(0, 0, 0, .25); }
  #menuBtn svg { width: 18px; height: 18px; }
  body.panel-open #menuBtn { opacity: 0; pointer-events: none; }

  /* bottom sheet */
  #scrim { position: fixed; inset: 0; z-index: 5; display: none; }
  body.panel-open #scrim { display: block; }
  #panel { position: fixed; z-index: 6; left: 50%; bottom: calc(var(--sab) + 10px); width: min(calc(100vw - 20px - var(--sal) - var(--sar)), 430px);
           max-height: calc(100% - var(--sat) - var(--sab) - 20px); overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; box-sizing: border-box;
           transform: translate(-50%, calc(100% + 40px)); visibility: hidden;
           transition: transform .42s cubic-bezier(.2, .9, .2, 1), visibility 0s .42s; border-radius: 28px; padding: 8px 14px 14px; }
  body.panel-open #panel { transform: translate(-50%, 0); visibility: visible; transition: transform .42s cubic-bezier(.2, .9, .2, 1), visibility 0s; }
  #grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); margin: 2px auto 10px; }
  .lbl { margin: 0 4px 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: rgba(243, 238, 230, .5); }
  #sands { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 2px; margin: 0 -4px 12px; }
  .sand { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 0 2px; cursor: pointer; min-height: 48px; }
  .sand i { width: 42px; height: 42px; border-radius: 50%; box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .35), inset 0 2px 3px rgba(255, 255, 255, .25), 0 0 0 2px transparent, 0 0 0 4px transparent;
            transition: box-shadow .2s, transform .2s; }
  .sand.on i { box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .35), inset 0 2px 3px rgba(255, 255, 255, .25), 0 0 0 2.5px rgba(18, 16, 14, .9), 0 0 0 4.5px rgba(255, 255, 255, .9); }
  .sand:active i { transform: scale(.92); }
  .sand span { font-size: 11px; color: rgba(243, 238, 230, .72); text-align: center; line-height: 1.15; max-width: 72px; }
  .sand.on span { color: var(--ink); }
  .seg { position: relative; display: flex; background: rgba(255, 255, 255, .07); border-radius: 14px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; height: 42px; border: 0; background: none; border-radius: 11px; font-size: 15px; font-weight: 500; cursor: pointer; position: relative; z-index: 1;
                display: flex; align-items: center; justify-content: center; gap: 7px; color: rgba(243, 238, 230, .75); transition: color .2s; }
  .seg button.on { color: var(--ink); }
  .seg button svg { width: 18px; height: 18px; opacity: .9; }
  .seg .pill { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; border-radius: 11px; background: rgba(255, 255, 255, .17);
               box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .3s cubic-bezier(.2, .9, .2, 1); }
  .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
  .acts button { height: 50px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, .07); cursor: pointer; font-size: 12px; font-weight: 500;
                 display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: rgba(243, 238, 230, .85); transition: background .15s; }
  .acts button:active { background: rgba(255, 255, 255, .18); transition: none; }
  .acts button svg { width: 20px; height: 20px; }
  .acts button.off { color: rgba(243, 238, 230, .45); }
  .acts button.warn { color: #ffd59a; }
  /* short screens (phone in landscape): sand on the left, tools on the right */
  @media (max-height: 520px) and (min-width: 560px) {
    #panel { width: min(calc(100vw - 20px - var(--sal) - var(--sar)), 780px); padding-top: 6px; }
    #cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    #sands { margin-bottom: 4px; }
    #grab { margin-bottom: 6px; }
  }
  #note { display: none; font-size: 12.5px; color: rgba(243, 238, 230, .6); margin: 12px 4px 0; line-height: 1.4; }
  #note b { color: rgba(243, 238, 230, .85); font-weight: 600; }

  #hint { position: fixed; z-index: 4; left: 50%; bottom: calc(var(--sab) + 16px); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
          text-align: center; font-size: 13px; letter-spacing: .02em; color: rgba(255, 250, 242, .92); opacity: 0; transition: opacity 1.4s; pointer-events: none;
          padding: 7px 14px; border-radius: 16px; background: rgba(12, 10, 8, .42); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-sizing: border-box; }
  #hint:empty { display: none; }
  #hint.show { opacity: 1; }
  #hint kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: rgba(0, 0, 0, .35); box-shadow: 0 0 0 .5px rgba(255, 255, 255, .25) inset; }
  #toast.glass { background: rgba(18, 16, 14, .78); }
  #toast { position: fixed; z-index: 7; left: 50%; top: calc(var(--sat) + 14px); transform: translate(-50%, -12px); opacity: 0; visibility: hidden;
           transition: opacity .3s, transform .3s, visibility 0s .3s; width: max-content; max-width: min(86vw, 380px); padding: 11px 16px; border-radius: 18px;
           font-size: 13.5px; line-height: 1.35; text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); visibility: visible; transition: opacity .3s, transform .3s; }
  #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 40px; text-align: center; color: #bbb; font-size: 15px; z-index: 9; }
  #fps { position: fixed; left: calc(var(--sal) + 8px); top: calc(var(--sat) + 8px); font: 11px ui-monospace, Menlo, monospace; color: #0f0; z-index: 8; pointer-events: none; text-shadow: 0 0 3px #000; white-space: pre; }
  @media (prefers-reduced-motion: reduce) { #panel, body.panel-open #panel, .seg .pill { transition-duration: .01s; } }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<button id="menuBtn" aria-label="Sand and tools" aria-expanded="false"><span><svg viewBox="0 0 24 24" fill="#fffaf2"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></span></button>
<div id="scrim"></div>
<div id="panel" class="glass" role="dialog" aria-label="Sand and tools">
  <div id="grab"></div>
  <div id="cols"><div>
  <div class="lbl">Sand</div>
  <div id="sands"></div>
  </div><div>
  <div class="lbl">Tool</div>
  <div class="seg" id="tools">
    <div class="pill"></div>
    <button data-tool="finger" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L5 14.6a1.4 1.4 0 0 1 2.1-1.9L9 14.5"/></svg>Finger</button>
    <button data-tool="rake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v9M5 12h14M5 12v6M9.7 12v6M14.3 12v6M19 12v6"/></svg>Rake</button>
    <button data-tool="pour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 4h10l-3.5 7v2h-3v-2z"/><path d="M12 16v.01M10.5 19v.01M13.5 19.5v.01M12 21.5v.01"/></svg>Pour</button>
  </div>
  <div class="acts">
    <button id="smoothBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 9c3-2 6 2 9 0s6-2 9 0M3 15c3-2 6 2 9 0s6-2 9 0"/></svg>Smooth</button>
    <button id="refillBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>New tray</button>
    <button id="soundBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5m0-5l-5 5" style="display:none"/></svg><b style="font-weight:inherit">Sound</b></button>
    <button id="tiltBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.5" transform="rotate(-14 12 12)"/><path d="M3 7.5a9 9 0 0 1 2-3M21 16.5a9 9 0 0 1-2 3"/></svg>Enable tilt</button>
    <button id="fsBtn" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
  </div>
  </div></div>
  <div id="note"></div>
</div>
<div id="hint"></div>
<div id="toast" class="glass" role="status" aria-live="polite"></div>
<div id="fatal"></div>
<div id="fps"></div>
<script>
// ---- 10_shaders_sim.js
// ============================================================================
// SIMULATION SHADERS
// State texture (RGBA32F):  r = height h (grain units, 1 = one grain diameter = one cell)
//                           g = u, velocity on the RIGHT face of the cell (cells/s, +x right)
//                           b = v, velocity on the BOTTOM face of the cell (cells/s, +y down)
//                           a = seed of the visible top grain (24-bit int packed in [0,1))
// Aux texture (RGBA32F):    r = finger mask (1 inside a contact footprint)
//                           g = dust density on the glass
//                           b = mass plowed this frame (for audio)
//                           a = unused
// Sim coordinates: x = column (screen right), y = row (screen DOWN). Texture row == sim y.
// ============================================================================

const GLSL_HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;

const VS_FULL = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const SIM_COMMON = GLSL_HEAD + `
uniform sampler2D uState;
uniform sampler2D uAux;
uniform ivec2 uSize;
uniform float uDt;
uniform uint uFrame;
vec4 S(ivec2 c){ return texelFetch(uState, clamp(c, ivec2(0), uSize - 1), 0); }
vec4 AX(ivec2 c){ return texelFetch(uAux, clamp(c, ivec2(0), uSize - 1), 0); }
uint pcg(uint v){ uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(ivec2 c, uint salt){ return float(pcg(uint(c.x) + pcg(uint(c.y) + pcg(uFrame * 9781u + salt)))) * (1.0 / 4294967296.0); }
float newSeed(ivec2 c, uint salt){ return float(pcg(uint(c.x) * 73856093u ^ uint(c.y) * 19349663u ^ pcg(uFrame * 31u + salt)) >> 8u) * (1.0 / 16777216.0); }
`;


// Shared by the velocity and advection passes: friction coefficients and the mobile thickness of a face.
const SIM_MOB = `
uniform vec3 uG;       // effective gravity in sim coords, cells/s^2. xy in-plane, z = normal load (>0 presses sand onto glass)
uniform vec4 uMu;      // x: mu static thin layer, y: mu static thick, z: kinetic/static ratio, w: earth pressure K
uniform float uFluid;  // vibration fluidization (0..1)
uniform vec2 uMob;     // x: rolling layer thickness (grains), y: mobile-layer model on/off
uniform float uHmaxM;  // lid height (grains)
uniform float uMobE;   // failure depth multiplier on the excess above the stopping slope
uniform vec2 uBag;     // x: Bagnold speed scale v0 (cells/s), y: cap of the speed-driven depth in units of the local step
// mobile thickness of the flow from a donor column hD into a receiver hR; gc = in-plane gravity along the flow
float muSt(float h){ return mix(uMu.x, uMu.y, smoothstep(0.6, 3.0, h)) * (1.0 - uFluid); }
float mob(float hD, float hR, float gc, float sp){
  if (uMob.y < 0.5) return hD;
  float gn = max(abs(uG.z), 1.0);
  float muS = muSt(hD);
  float muTh = sp > 2.0 ? muS * uMu.z : muS;
  float slide = smoothstep(0.92, 1.04, length(uG.xy) / (muTh * abs(uG.z) + 1.0));
  float e = min(uMobE * 0.5 * max(0.0, (hD - hR) + gc / (uMu.w * gn) - muS * uMu.z / uMu.w), max(hD - hR, 0.0));
  // Bagnold: a flow moving at speed sp carries a layer ~ (sp / v0)^(2/3) grains thick (avalanches deepen as they speed up)
  float hb = pow(sp / uBag.x, 0.6667);
  float m = max(e + uMob.x, min(hb, max(hD - hR, 0.0) * uBag.y + uMob.x));
  return max(mix(min(hD, m), hD, slide), min(hD, max(hD - uHmaxM, 0.0)));
}
`;

// ---------------------------------------------------------------------------
// Pass 1: face velocity update
//   momentum advection (semi-Lagrangian on the MAC faces) -> gravity + earth pressure (cliff-limited)
//   -> Coulomb friction with static/kinetic hysteresis and mu(I) rate strengthening -> CFL clamp.
//   Dry faces (no sand on either side) inherit the velocity of the upstream face, so a sliding sheet's
//   front carries its momentum instead of restarting from rest in every new cell.
// ---------------------------------------------------------------------------
const FS_VELOCITY = SIM_COMMON + SIM_MOB + `
uniform float uVmax;   // CFL clamp, cells/s
uniform float uVisc;   // velocity smoothing per substep (0..1)
uniform float uLid;    // lid stiffness
uniform float uKick;   // random agitation amplitude (cells/s)
uniform float uExtrap; // dry-face velocity inheritance factor
uniform vec2 uStop;    // x: min flow thickness used in the inertial number, y: speed below which static friction applies
uniform vec4 uRate;    // x: mu(I) rate strengthening (mu2 - mu1), y: I0, z: max pressure gradient (cliff limit), w: advection on/off
out vec4 o;

float hp(float h){ return max(h - 0.8, 0.0); }          // monolayer exerts no lateral pressure
float lidp(float h){ return max(h - uHmaxM, 0.0); }
float U(ivec2 c){ return (c.x < 0 || c.y < 0 || c.x >= uSize.x - 1 || c.y >= uSize.y) ? 0.0 : texelFetch(uState, c, 0).g; }
float V(ivec2 c){ return (c.x < 0 || c.y < 0 || c.x >= uSize.x || c.y >= uSize.y - 1) ? 0.0 : texelFetch(uState, c, 0).b; }
// bilinear samples of the face grids; q in face-index space (u-face (i,j) sits at x=i+1, y=j+0.5)
float sampU(vec2 q){ ivec2 i = ivec2(floor(q)); vec2 f = q - vec2(i);
  return mix(mix(U(i), U(i + ivec2(1, 0)), f.x), mix(U(i + ivec2(0, 1)), U(i + ivec2(1, 1)), f.x), f.y); }
float sampV(vec2 q){ ivec2 i = ivec2(floor(q)); vec2 f = q - vec2(i);
  return mix(mix(V(i), V(i + ivec2(1, 0)), f.x), mix(V(i + ivec2(0, 1)), V(i + ivec2(1, 1)), f.x), f.y); }

// Generic face update. hA, hB: heights on both sides of the face (B is the + side).
float faceUpdate(float hA, float hB, float slopePerp, float vel, float perp, float gAlong, float gPerp, float gN, float gMag, float neighAvg, float upstream, ivec2 c, uint salt){
  float hf = 0.5 * (hA + hB);
  if (max(hA, hB) < 0.01) return clamp(upstream * uExtrap, -uVmax, uVmax);
  float K = uMu.w;
  float dP = clamp(hp(hB) - hp(hA), -uRate.z, uRate.z);
  float aAlong = gAlong - K * gN * dP - uLid * gMag * clamp(lidp(hB) - lidp(hA), -uRate.z, uRate.z);
  float aPerp  = gPerp  - K * gN * clamp(slopePerp, -uRate.z, uRate.z);
  // smoothing of the face velocity with its neighbours (keeps the granular flow coherent)
  vel = mix(vel, neighAvg, uVisc);
  // sand squeezed above the lid is pushed out sideways without friction holding it back
  float over = max(lidp(hA), lidp(hB));
  float muS = mix(uMu.x, uMu.y, smoothstep(0.6, 3.0, hf)) * (1.0 - uFluid) * (1.0 - 0.7 * smoothstep(0.0, 3.0, over));
  float packing = smoothstep(uHmaxM * 0.85, uHmaxM, hf) * length(vec2(gAlong, gPerp)) * 0.6;
  float N = max(gN, 0.0) + packing;
  vec2 v = vec2(vel, perp);
  float sp = length(v);
  bool moving = sp > uStop.y;
  vec2 trial = v + vec2(aAlong, aPerp) * uDt;
  // inertial number I = shear rate * d / sqrt(P / rho): shear ~ |u| / h, P ~ rho N h (d = 1 cell)
  float hm = vel >= 0.0 ? mob(hA, hB, gAlong, sp) : mob(hB, hA, -gAlong, sp);
  float hI = max(hm, uStop.x);
  float I = sp / (hI * sqrt(hI * max(N, 0.05 * gMag + 1.0)));
  float muK = muS * uMu.z + uRate.x * (1.0 - uFluid) * I / (I + uRate.y);
  float fr = (moving ? muK : muS) * N * uDt;
  float lt = length(trial);
  float nv = lt <= fr ? 0.0 : trial.x * (1.0 - fr / lt);
  nv += (rnd(c, salt) - 0.5) * uKick * smoothstep(0.3, 1.5, hf);
  // lid: a face may not push a cell beyond the lid height in one substep (inelastic stop against packed sand)
  float room = 0.5 * max(uHmaxM - hB, 0.5 * (lidp(hA) - lidp(hB)));
  if (nv > 0.0) nv = min(nv, max(room, 0.0) / (max(hA, 0.05) * uDt));
  room = 0.5 * max(uHmaxM - hA, 0.5 * (lidp(hB) - lidp(hA)));
  if (nv < 0.0) nv = max(nv, -max(room, 0.0) / (max(hB, 0.05) * uDt));
  return clamp(nv, -uVmax, uVmax);
}

void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 sC = S(c);
  vec4 sR = S(c + ivec2(1, 0)), sL = S(c - ivec2(1, 0));
  vec4 sD = S(c + ivec2(0, 1)), sU = S(c - ivec2(0, 1));
  vec4 sRU = S(c + ivec2(1, -1)), sRD = S(c + ivec2(1, 1));
  vec4 sDL = S(c + ivec2(-1, 1)), sDR = sRD;
  float mC = AX(c).r, mR = AX(c + ivec2(1, 0)).r, mD = AX(c + ivec2(0, 1)).r;
  float gMag = length(uG);
  float adv = uRate.w;

  // ---- u on right face (between c and c+x)
  float u = 0.0;

  vec4 xc = cubicW(f.x), yc = cubicW(f.y);
  vec4 c = tc.xxyy + vec2(-0.5, 1.5).xyxy;
  vec4 s = vec4(xc.xz + xc.yw, yc.xz + yc.yw);
  vec4 off = (c + vec4(xc.yw, yc.yw) / s) / sz.xxyy;
  vec4 s0 = texture(t, off.xz), s1 = texture(t, off.yz), s2 = texture(t, off.xw), s3 = texture(t, off.yw);
  float sx = s.x / (s.x + s.y), sy = s.z / (s.z + s.w);
  return mix(mix(s3, s2, sx), mix(s1, s0, sx), sy);
}
// cheap lattice hash for value noise
float hq(vec2 p){ uvec2 q = uvec2(ivec2(p)); uint h = q.x * 0x27d4eb2du ^ q.y * 0x165667b1u; h ^= h >> 15; h *= 0x85ebca6bu; h ^= h >> 13; return u2f(h); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hq(i), hq(i + vec2(1, 0)), f.x), mix(hq(i + vec2(0, 1)), hq(i + vec2(1, 1)), f.x), f.y);
}
// filmic curve (ACES fit, Narkowicz)
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

// Grain = rounded, slightly irregular ellipsoidal dome. Local frame: cs = (cos,sin) of orientation, sc = semi-axes.
// irr = amplitude of 3-lobed outline irregularity (cos/sin parts). Returns height above the bed (or -1e9 outside).
float dome(vec2 p, vec2 ctr, vec2 cs, vec2 sc, vec2 irr, float zTop, out float d2, out vec2 grad){
  vec2 dv = p - ctr;
  vec2 q = vec2(dot(dv, cs), dot(dv, vec2(-cs.y, cs.x))) / sc;
  float r2 = dot(q, q);
  float ir = inversesqrt(max(r2, 1e-8));
  float c = q.x * ir, s = q.y * ir;
  float k = 1.0 + irr.x * c * (4.0 * c * c - 3.0) + irr.y * s * (3.0 - 4.0 * s * s);
  d2 = r2 / (k * k);
  if (d2 >= 1.0) { grad = vec2(0.0); return -1e9; }
  float zr = sqrt(1.0 - d2);
  vec2 dzdq = -zTop * q / (max(zr, 0.18) * k * k);
  vec2 dl = dzdq / sc;
  grad = cs * dl.x + vec2(-cs.y, cs.x) * dl.y;
  return zTop * zr;
}
float domeH(vec2 p, vec2 ctr, vec2 cs, vec2 sc, float zTop){
  vec2 dv = p - ctr;
  vec2 q = vec2(dot(dv, cs), dot(dv, vec2(-cs.y, cs.x))) / sc;
  float d2 = dot(q, q);
  return d2 < 1.0 ? zTop * sqrt(1.0 - d2) : -1e9;
}

struct Gr { float s, z, d2, rad, top; vec2 g; uint key; vec2 q; uint pk; };
void consider(Gr c, inout Gr A, inout Gr B){
  if (c.s > A.s) { B = A; A = c; } else if (c.s > B.s) { B = c; }
}
// mineral of a grain identity: albedo (with per-grain variation) and optical properties
// mineral (and sparkle facet) follow the grain identity; the small albedo/tint scatter follows the pose hash, so runs of
// duplicated identities left behind by the stochastic transport do not read as streaks of identical grains
vec3 grainAlbedo(uint key, uint pk, out vec4 prop, out uint m5){
  uint m1 = pcg(key ^ 0x27d4eb2du);
  uint m2 = pcg(pk ^ 0x51ed270bu), m3 = m2 >> 9u;
  m5 = pcg(m1);
  float rm = u2f(m1);
  vec3 alb = uMinCol[5]; prop = uMinProp[5];
  for (int k = 0; k < 6; k++) { if (rm < uMinProp[k].x) { alb = uMinCol[k]; prop = uMinProp[k]; break; } }
  alb *= 1.0 + uAlbVar * (u2f(m2) - 0.5) * 2.0;
  alb *= mix(vec3(0.97, 1.0, 1.04), vec3(1.03, 1.0, 0.95), float(m3 & 1023u) / 1023.0);
  return alb;
}

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uCellPx;   // cell coords, y down
  // ---- macro surface
  vec4 sf = bicubic(uSurf, p);
  vec4 sg = bicubic(uSurf2, p);
  float hM = sf.r, clr = sf.g, aoM = sf.b, spd = sf.a;
  float shM = clamp(0.5 + clr, 0.0, 1.0);
  float hx = sg.x + sg.z * uMicroN, hy = sg.y + sg.w * uMicroN;

  vec3 L = normalize(uLs);
  float lxy = max(length(L.xy), 1e-3);
  vec2 ldir = L.xy / lxy;
  float rise = L.z / lxy;
  const float T1 = 0.32, T2 = 0.7;
  vec2 ps1 = p + ldir * T1, ps2 = p + ldir * T2;

  // ---- grains: top layer (one per cell, jittered) + bed layer (one per cell corner, lower).
  // A = front-most grain at this pixel, B = the one behind it (for anti-aliased outlines).
  ivec2 ci = ivec2(floor(p));
  Gr A = Gr(-1e9, -1e9, 1.0, 0.5, 0.5, vec2(0.0), 0u, vec2(0.0), 0u);
  Gr B = A;
  float occ = -1e9;          // highest top-grain surface seen toward the light (minus ray rise)
  float nearEdge = 1e9;      // distance (cells) to the nearest top-grain outline (contact shadow on glass)
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 nc = ci + ivec2(i, j);
    if (nc.x < 0 || nc.y < 0 || nc.x >= uSize.x || nc.y >= uSize.y) continue;
    vec4 st = texelFetch(uState, nc, 0);
    float h = st.r;
    if (h < 0.02) continue;
    uint id = uint(st.a * 16777216.0);
    // Identity (mineral, colour, size) travels with the grain; its pose (offset, orientation, seating) is re-drawn
    // per cell, so a grain copied into a neighbouring cell by the flow appears tumbled rather than duplicated.
    uint kp = pcg(id ^ (uint(nc.x) * 0x9E3779B1u + uint(nc.y) * 0x85EBCA77u));
    // few hashes, several 8-bit random numbers each (keeps the per-pixel cost low)
    uint k1 = pcg(kp), k2 = pcg(k1), k8 = pcg(id ^ 0x68e31da4u);
    vec4 R1 = vec4(uvec4(k1, k1 >> 8u, k1 >> 16u, k1 >> 24u) & 255u) * (1.0 / 256.0) + (0.5 / 256.0);
    vec4 R2 = vec4(uvec4(k2, k2 >> 8u, k2 >> 16u, k2 >> 24u) & 255u) * (1.0 / 256.0) + (0.5 / 256.0);
    vec4 R8 = vec4(uvec4(k8, k8 >> 8u, k8 >> 16u, k8 >> 24u) & 255u) * (1.0 / 256.0) + (0.5 / 256.0);
    float r1 = R1.x, r2 = R1.y, r3 = R1.z, r4 = R1.w, r6 = R2.x, r7 = R2.y;
    // size distribution: well sorted, slightly skewed (a few coarse and fine grains); size/thin-layer presence
    // belong to the identity
    float sz = 0.86 + 0.28 * R8.y;
    if (R8.x < 0.05) sz *= 1.25; else if (R8.x < 0.17) sz *= 0.74;
    float rad = uGrainR * sz * uPack;
    vec2 cs = normalize(R2.zw - 0.5 + 1e-4);
    vec2 sc = vec2(rad, rad * (0.7 + 0.28 * r6));
    float zTop = rad * (0.8 + 0.2 * r7);
    vec2 tilt = (vec2(r4, R8.w) - 0.5) * uFacet;   // facet tilt: grains are not perfect domes
    // ---- top grain (thin layers: sparse coverage)
    if (!(h < 1.0 && R8.z > h)) {
      vec2 ctr = vec2(nc) + 0.5 + (vec2(r2, r3) - 0.5) * 0.86;
      float zb = (r1 - 0.5) * uRelief;                   // grains sit at different heights in the packing
      if (h < 1.2) zb = 0.0;                             // resting directly on the glass
      float d2; vec2 g;
      float z = dome(p, ctr, cs, sc, (vec2(r6, r7) - 0.5) * uAngular, zTop, d2, g);
      nearEdge = min(nearEdge, (length(p - ctr) - rad * 0.85));
      if (z > -1e8) consider(Gr(zb + zTop * sqrt(sqrt(1.0 - d2)), z + zb, d2, rad, zTop, g * mix(1.0, uGrainN, smoothstep(0.8, 1.6, h)) + tilt, id, (p - ctr) / rad, k2), A, B);   // isolated grains: full roundness
      occ = max(occ, domeH(ps1, ctr, cs, sc, zTop) + zb - rise * T1);
      occ = max(occ, domeH(ps2, ctr, cs, sc, zTop) + zb - rise * T2);
    }
    // ---- bed grain below (visible through the gaps)
    if (h > 1.15 + r3 * 0.6) {
      uint b3 = pcg(k2);
      vec4 RB = vec4(uvec4(b3, b3 >> 8u, b3 >> 16u, b3 >> 24u) & 255u) * (1.0 / 256.0) + (0.5 / 256.0);
      vec2 ctr2 = vec2(nc) + 1.0 + (RB.xy - 0.5) * 0.6;
      float rb = rad * (0.95 + 0.2 * RB.z);
      float d2; vec2 g;
      float z = dome(p, ctr2, cs.yx * vec2(1.0, -1.0), vec2(rb, rb * 0.85), vec2(0.0), rb * 0.8, d2, g);
      float zb2 = -0.5 * rb - 0.5 * uRelief;
      if (z > -1e8) consider(Gr(zb2 + rb * 0.8 * sqrt(sqrt(1.0 - d2)), z + zb2, d2, rb, rb * 0.8, g * uGrainN - tilt.yx, b3, (p - ctr2) / rb, b3 ^ k1), A, B);
    }
  }

  vec3 eye = vec3(vec2(uSize) * 0.5, uEye);
  vec3 V = normalize(eye - vec3(p, hM));
  vec3 nMacro = normalize(vec3(-hx, -hy, 1.0));
  vec3 col;
  bool covered = A.s > -1e8;
  if (covered) {
    // anti-aliased outline: blend the front grain with the one behind over ~1.5 px
    vec4 prop, propB; uint m5, m5B;
    vec3 alb = grainAlbedo(A.key, A.pk, prop, m5);
    float w = 1.0;
    if (B.s > -1e8) {
      w = 0.5 + 0.5 * clamp((A.s - B.s) * uCellPx / 2.2, 0.0, 1.0);
      vec3 albB = grainAlbedo(B.key, B.pk, propB, m5B);
      alb = mix(albB, alb, w);
      prop = mix(propB, prop, w);
    } else {
      w = clamp((1.0 - sqrt(A.d2)) * A.rad * uCellPx / 1.6, 0.0, 1.0);   // outline over glass / dark gap
      B.z = -0.6; B.g = vec2(0.0); B.top = A.top;
    }
    float z = mix(B.z, A.z, w);
    vec2 gG = mix(B.g, A.g, w);
    float top = mix(B.top, A.top, w);
    // faint internal mottling of each grain
    vec2 mo = vec2(float(A.key & 1023u), float((A.key >> 10u) & 1023u));
    alb *= 1.0 + uMottle * (vnoise(p * 3.5 + mo) + 0.6 * vnoise(p * 9.0 + mo.yx) - 0.8);

    // grain-scale cast shadow from neighbouring grains toward the light (quartz passes some light)
    float shG = mix(uGrainShMin, 1.0, smoothstep(-0.06, 0.1, z - occ));
    // macro shadow edge resolved per grain: grain tops poke out of the shadow first
    shM = clamp(0.5 + clr + (z - 0.15) * 1.6, 0.0, 1.0);
    float sh = shM * mix(1.0, shG, smoothstep(0.0, 0.6, hM));

    vec3 n = normalize(vec3(-(hx + gG.x), -(hy + gG.y), 1.0));
    float ndl = dot(n, L);
    float hRel = z / max(top, 1e-3);                       // ~1 at grain tops, <0 deep in the bed
    float cav = mix(uGapLight, 1.0, smoothstep(-1.4, 0.9, hRel));
    vec3 key = uLightCol * max(ndl, 0.0) * sh;
    // sky (cool, from above) + warm bounce from the surrounding sand onto grain flanks
    float skyV = (0.55 + 0.45 * n.z) * aoM * cav;
    vec3 bounce = uMeanCol * uLightCol * max(L.z, 0.0) * 0.35 * (1.0 - n.z) * cav * aoM;
    vec3 c0 = alb * (key * mix(0.6, 1.0, cav) + uSkyCol * skyV + bounce);
    // translucency: light scattered inside quartz-like grains (soft glow, also on the shadow side)
    c0 += alb * alb * uLightCol * prop.z * 0.22 * shM * (0.35 + 0.65 * shG) * max(dot(nMacro, L), 0.0) * (1.0 - 0.6 * A.d2) * cav;
    // glossy specular (polished quartz)
    vec3 Hh = normalize(L + V);
    float nh = max(dot(n, Hh), 0.0);
    float a2 = pow(prop.y * 0.8, 4.0);
    float D = a2 / (3.14159 * pow(nh * nh * (a2 - 1.0) + 1.0, 2.0));
    float F = 0.04 + 0.96 * pow(1.0 - max(dot(Hh, V), 0.0), 5.0);
    c0 += uLightCol * D * F * max(ndl, 0.0) * sh * 0.12 * uSpec * w;
    // sparkle: a small flat facet (mica flake, cleavage plane of quartz/glass) on some grains mirrors the light when the
    // tilt brings it into alignment -> pinpoint glints that twinkle as the phone moves
    if (u2f(m5) < prop.w * 2.0 && w > 0.9) {
      uint m6 = pcg(m5), m7 = pcg(m6), m8 = pcg(m7);
      vec2 fcn = (vec2(u2f(m7), u2f(m8)) - 0.5) * 0.9;
      float fm = 1.0 - smoothstep(0.12, 0.26, length(A.q - fcn));
      if (fm > 0.0) {
        vec3 nf = normalize(nMacro + vec3((vec2(u2f(m6), u2f(pcg(m8))) - 0.5) * 1.2, 0.0));
        float g = max(dot(reflect(-L, nf), V), 0.0);
        c0 += uLightCol * pow(g, 45.0) * 6.0 * sh * fm;
      }
    }
    // motion blur of grain detail in fast flow (grains moving > ~1 grain per frame)
    float mb = clamp((spd - 25.0) / 160.0, 0.0, 0.7);
    vec3 cBlur = uMeanCol * (uLightCol * max(dot(nMacro, L), 0.0) * shM * 0.72 + uSkyCol * aoM * 0.7);
    col = mix(c0, cBlur, mb);
  } else {
    // ---- bare glass (black screen) under thin layers, or deep crevice in the bed
    float shG = smoothstep(-0.06, 0.1, -0.05 - occ);
    vec3 R = reflect(-V, vec3(0.0, 0.0, 1.0));
    float fres = 0.04 + 0.96 * pow(1.0 - max(V.z, 0.0), 5.0);
    float ceiling = pow(max(dot(R, normalize(uUp)), 0.0), 2.0);
    float lamp = exp(-pow(length(R - L) / 0.45, 2.0));
    // faint oily smudges on the glass (fixed to the device, so a static pattern is physically right)
    float smudge = vnoise(p * 0.07 + 13.0) * 0.6 + vnoise(p * 0.19 + 71.0) * 0.4;
    smudge = smoothstep(0.35, 0.9, smudge);
    vec3 env = uSkyCol * (0.16 + 0.55 * ceiling) * (0.8 + 0.6 * smudge) + uLightCol * (0.5 + 1.2 * smudge) * lamp;
    vec3 glass = vec3(0.0012, 0.0013, 0.0016) + env * fres;
    // sand dust left on the glass: faint haze + sparse tiny lit specks (two sizes)
    float dust = texelFetch(uAux, clamp(ivec2(p), ivec2(0), uSize - 1), 0).g;
    vec2 fc = gl_FragCoord.xy;
    float s1 = step(1.0 - dust * 0.010, hash2(floor(fc / 1.5))) * (0.3 + 0.7 * hash2(floor(fc / 1.5) + 31.0));
    float s2 = step(1.0 - dust * 0.0025, hash2(floor(fc / 2.6) + 57.0)) * (0.5 + 0.5 * hash2(floor(fc / 2.6) + 9.0));
    float speck = max(s1 * 0.6, s2);
    glass += uMeanCol * (uLightCol * max(L.z, 0.0) * 0.35 * speck * shG + 0.015 * dust * (1.0 + smudge) * (uSkyCol + uLightCol * 0.3 * shG));
    // contact shadow around grains lying on the glass + their cast shadow
    glass *= (1.0 - 0.7 * exp(-max(nearEdge, 0.0) * 4.0)) * mix(0.35, 1.0, shG);
    // deep gap between grains: lit by light scattered through the surrounding grains
    vec3 crevice = uMeanCol * (uSkyCol * 0.3 + uLightCol * max(L.z, 0.0) * 0.16 * shM) * aoM;
    col = mix(glass, crevice, smoothstep(0.5, 1.5, hM));
  }
  if (uDebug == 1) col = uMeanCol * (uLightCol * max(dot(nMacro, L), 0.0) * shM + uSkyCol * (0.55 + 0.45 * nMacro.z) * aoM);
  if (uDebug == 2) col = vec3(shM, aoM, 0.5 + 0.5 * nMacro.x);
  col *= uExposure;
  // hue-preserving filmic: tonemap luminance, keep some per-channel roll-off for natural highlight desaturation
  float Y = dot(col, vec3(0.2126, 0.7152, 0.0722));
  vec3 cY = col * (aces(vec3(Y)).x / max(Y, 1e-5));
  col = clamp(mix(cY, aces(col), uDesat), 0.0, 1.0);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash2(gl_FragCoord.xy + 17.0) - 0.5) / 255.0;
  frag = vec4(col, 1.0);
}
`;

// ============================================================================
// ENGINE: WebGL2 resources, simulation stepping, rendering, async stats readback
// ============================================================================

class SandEngine {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl2', {
      antialias: false, alpha: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
    });
    if (!gl) throw new Error('WebGL2 is not available on this device.');
    this.gl = gl;
    this.floatRT = !!gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('EXT_color_buffer_half_float');
    gl.getExtension('EXT_float_blend');
    this.stateFmt = this.floatRT ? { i: gl.RGBA32F, t: gl.FLOAT } : { i: gl.RGBA16F, t: gl.HALF_FLOAT };
    this.frame = 0;
    this.stats = { mass: 0, activity: 0, plow: 0, moving: 0, valid: false };
    this.targetMass = 0;
    this.massCorr = 1;
    this._pending = [];
    this._initGL();
  }

  _initGL() {
    const gl = this.gl;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.progs = {
      vel: this._prog(FS_VELOCITY), adv: this._prog(FS_ADVECT), contact: this._prog(FS_CONTACT), contact2: this._prog(FS_CONTACT2), redAll: this._prog(FS_REDUCE_ALL),
      red0: this._prog(FS_REDUCE0), red: this._prog(FS_REDUCE), surf: this._prog(FS_SURF), render: this._prog(FS_RENDER), rough: this._prog(FS_ROUGH)
    };
  }

  _prog(fs) {
    const gl = this.gl;
    const mk = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(s);
        const lines = src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n');
        console.error(log + '\n' + lines);
        throw new Error('Shader compile failed: ' + log);
      }
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, VS_FULL));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link failed: ' + gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace(/\[0\]$/, '');
      u[name] = gl.getUniformLocation(p, info.name);
    }
    return { p, u };
  }

  _tex(w, h, internal, type, filter, data = null) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, data);
    return t;
  }

  _fbo(...texs) {
    const gl = this.gl;
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
    gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete: ' + st);
    return f;
  }

  // Allocate the simulation grid. `init` is Float32Array RGBA (h,u,v,seed) of size w*h*4
  setup(w, h, initState, initAux) {
    const gl = this.gl;
    this.W = w; this.H = h;
    this._freeSim();
    const F = this.stateFmt;
    let st = initState, ax = initAux;
    if (!this.floatRT) { st = toHalf(initState); ax = toHalf(initAux); }
    this.state = [this._tex(w, h, F.i, F.t, gl.NEAREST, st), this._tex(w, h, F.i, F.t, gl.NEAREST, null)];
    this.aux = [this._tex(w, h, F.i, F.t, gl.NEAREST, ax), this._tex(w, h, F.i, F.t, gl.NEAREST, null)];
    this.cur = 0; this.auxCur = 0;
    this.fState = [this._fbo(this.state[0]), this._fbo(this.state[1])];
    this.fAux = [this._fbo(this.aux[0]), this._fbo(this.aux[1])];
    this.surf = this._tex(w, h, gl.RGBA16F, gl.HALF_FLOAT, gl.LINEAR, null);
    this.fSurf = this._fbo(this.surf);
    // reduction chain
    this.red = [];
    let rw = w, rh = h;
    do {
      rw = Math.ceil(rw / 4); rh = Math.ceil(rh / 4);
      const t = this._tex(rw, rh, F.i, F.t, gl.NEAREST, null);
      this.red.push({ t, f: this._fbo(t), w: rw, h: rh });
    } while (rw * rh > 64);
    this.sumTex = this._tex(1, 1, F.i, F.t, gl.NEAREST, null);
    this.fSum = this._fbo(this.sumTex);
    const last = this.red[this.red.length - 1];
    this.readBuf = new Float32Array(last.w * last.h * 4);
    this.pbos = [gl.createBuffer(), gl.createBuffer(), gl.createBuffer()];
    this.pboIdx = 0;
    this.pbos.forEach(b => {
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, b);
      gl.bufferData(gl.PIXEL_PACK_BUFFER, this.readBuf.byteLength, gl.STREAM_READ);
    });
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    this._pending = [];
    this.quiet = 0; this.gRest = null; this.idle = false;
    let m = 0; for (let i = 0; i < initState.length; i += 4) m += initState[i];
    this.targetMass = m; this.stats.mass = m; this.stats.valid = false;
  }

  _freeSim() {
    const gl = this.gl;
    if (!this.state) return;
    [...this.state, ...this.aux, this.surf, this.sumTex].forEach(t => gl.deleteTexture(t));
    [...this.fState, ...this.fAux, this.fSurf, this.fSum].forEach(f => gl.deleteFramebuffer(f));
    this.red.forEach(r => { gl.deleteTexture(r.t); gl.deleteFramebuffer(r.f); });
    this.pbos.forEach(b => gl.deleteBuffer(b));
    this._pending.forEach(p => gl.deleteSync(p.sync));
  }

  _bindTex(unit, tex, loc) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(loc, unit);
  }

  _simUniforms(pr, dt) {
    const gl = this.gl;
    gl.uniform2i(pr.u.uSize, this.W, this.H);
    if (pr.u.uDt) gl.uniform1f(pr.u.uDt, dt);
    if (pr.u.uFrame) gl.uniform1ui(pr.u.uFrame, this.frame >>> 0);
  }

  // One frame of simulation. P: physics params, contacts: {segs:[[x0,y0,x1,y1,r],...], pour:[x,y,r,amount]}
  simulate(frameDt, P, contacts) {
    const gl = this.gl;
    // ---- idle: when everything has come to rest (exactly zero velocities, read back asynchronously), nothing
    // touches the sand and gravity has not changed, skip the whole simulation (battery + headroom for rendering).
    const g = P.g, gm = Math.hypot(g[0], g[1], g[2]) || 1;
    const wake = contacts.segs.length > 0 || (contacts.pour && contacts.pour[3] > 0) || P.fluid > 0.003 || P.kick > 0 ||
      !this.gRest || Math.hypot(g[0] - this.gRest[0], g[1] - this.gRest[1], g[2] - this.gRest[2]) > 0.006 * gm;
    if (wake) { this.quiet = 0; this.gRest = g.slice(); }
    this.idle = !wake && this.quiet >= 4;
    if (this.idle) { this._poll(); return; }
    gl.bindVertexArray(this.vao);
    gl.viewport(0, 0, this.W, this.H);
    gl.disable(gl.BLEND);

    // ---- contact pass (aux: footprint mask, removed mass, unnormalised rim deposit)
    const segs = contacts.segs.slice(0, 16);
    {
      const pr = this.progs.contact;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fAux[this.cur ^ 1]);
      this._bindTex(0, this.state[this.cur], pr.u.uState);
      this._bindTex(1, this.aux[this.cur], pr.u.uAux);
      this._simUniforms(pr, 0);
      const a = new Float32Array(64), r = new Float32Array(16), cut = new Float32Array(16);
      segs.forEach((s, i) => { a.set([s[0], s[1], s[2], s[3]], i * 4); r[i] = s[4]; cut[i] = s.length > 5 ? s[5] : 1e4; });
      gl.uniform4fv(pr.u.uSeg, a);
      gl.uniform1fv(pr.u.uSegR, r);
      gl.uniform1fv(pr.u.uSegCut, cut);
      gl.uniform1i(pr.u.uNSeg, segs.length);
      gl.uniform1f(pr.u.uMassCorr, this.massCorr);
      gl.uniform1f(pr.u.uFrameDt, frameDt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // ---- GPU sum of removed / deposited mass (only when something touches the sand)
    if (segs.length) {
      let src = this.aux[this.cur ^ 1], sw = this.W, sh = this.H;
      const pr = this.progs.red;
      gl.useProgram(pr.p);
      for (let i = 0; i < this.red.length; i++) {
        const r = this.red[i];
        gl.bindFramebuffer(gl.FRAMEBUFFER, r.f);
        gl.viewport(0, 0, r.w, r.h);
        this._bindTex(0, src, pr.u.uSrc);
        gl.uniform2i(pr.u.uSrcSize, sw, sh);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        src = r.t; sw = r.w; sh = r.h;
      }
      const pa = this.progs.redAll;
      gl.useProgram(pa.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fSum);
      gl.viewport(0, 0, 1, 1);
      this._bindTex(0, src, pa.u.uSrc);
      gl.uniform2i(pa.u.uSrcSize, sw, sh);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.viewport(0, 0, this.W, this.H);
    }
    // ---- apply removal + normalised deposit, pour, global mass correction
    {
      const pr = this.progs.contact2;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fState[this.cur ^ 1]);
      this._bindTex(0, this.state[this.cur], pr.u.uState);
      this._bindTex(1, this.aux[this.cur ^ 1], pr.u.uAux);
      this._bindTex(2, this.sumTex, pr.u.uSum);
      this._simUniforms(pr, 0);
      const po = contacts.pour || [0, 0, 1, 0];
      gl.uniform4f(pr.u.uPour, po[0], po[1], po[2], po[3]);
      gl.uniform1f(pr.u.uMassCorr, this.massCorr);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      this.cur ^= 1;
      this.massCorr = 1;
    }
    this.frame++;

    // ---- substeps
    const n = Math.max(1, Math.min(P.maxSubsteps, Math.round(frameDt / P.dtSub)));
    const dt = frameDt / n;
    const vmax = P.cfl / dt;
    const pv = this.progs.vel, pa = this.progs.adv;
    for (let i = 0; i < n; i++) {
      gl.useProgram(pv.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fState[this.cur ^ 1]);
      this._bindTex(0, this.state[this.cur], pv.u.uState);
      this._bindTex(1, this.aux[this.cur], pv.u.uAux);
      this._simUniforms(pv, dt);
      gl.uniform3f(pv.u.uG, P.g[0], P.g[1], P.g[2]);
      gl.uniform4f(pv.u.uMu, P.muThin, P.muThick, P.kinetic, P.K);
      gl.uniform1f(pv.u.uVmax, vmax);
      gl.uniform1f(pv.u.uVisc, P.visc);
      gl.uniform1f(pv.u.uFluid, P.fluid);
      gl.uniform1f(pv.u.uHmaxM, P.hmax);
      gl.uniform1f(pv.u.uLid, P.lid);
      gl.uniform1f(pv.u.uKick, P.kick);
      gl.uniform2f(pv.u.uMob, P.rollLayer, P.mobile ? 1 : 0);
      gl.uniform1f(pv.u.uMobE, P.mobE);
      gl.uniform2f(pv.u.uBag, P.bagV0, P.bagCap);
      gl.uniform1f(pv.u.uExtrap, P.extrap);
      gl.uniform2f(pv.u.uStop, P.hIMin, P.vStop);
      gl.uniform4f(pv.u.uRate, P.rate, P.rateI0, P.pgMax, P.advect ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      this.cur ^= 1;

      gl.useProgram(pa.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.fState[this.cur ^ 1]);
      this._bindTex(0, this.state[this.cur], pa.u.uState);
      this._simUniforms(pa, dt);
      gl.uniform3f(pa.u.uG, P.g[0], P.g[1], P.g[2]);
      gl.uniform4f(pa.u.uMu, P.muThin, P.muThick, P.kinetic, P.K);
      gl.uniform1f(pa.u.uFluid, P.fluid);
      gl.uniform2f(pa.u.uMob, P.rollLayer, P.mobile ? 1 : 0);
      gl.uniform1f(pa.u.uHmaxM, P.hmax);
      gl.uniform1f(pa.u.uMobE, P.mobE);
      gl.uniform1f(pa.u.uSeedMix, P.seedMix);
      gl.uniform2f(pa.u.uBag, P.bagV0, P.bagCap);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      this.cur ^= 1;
      this.frame++;
    }
    this._reduceAndRead();
  }

  _reduceAndRead() {
    const gl = this.gl;
    this._poll();
    if (this._pending.length >= 3) return;
    this._reduce();
  }

  // poll pending async stats reads
  _poll() {
    const gl = this.gl;
    while (this._pending.length) {
      const p = this._pending[0];
      const st = gl.clientWaitSync(p.sync, 0, 0);
      if (st === gl.TIMEOUT_EXPIRED) break;
      gl.deleteSync(p.sync);
      this._pending.shift();
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, p.buf);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, this.readBuf);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      const b = this.readBuf;
      let m = 0, a = 0, pl = 0, mv = 0;
      for (let i = 0; i < b.length; i += 4) { m += b[i]; a += b[i + 1]; pl += b[i + 2]; mv += b[i + 3]; }
      this.stats.mass = m; this.stats.activity = a; this.stats.plow = pl; this.stats.moving = mv; this.stats.valid = true;
      if (m > 0 && this.targetMass > 0) {
        const c = this.targetMass / m;
        this.massCorr = Math.min(1.002, Math.max(0.998, c));
      }
      // rest detection for idling: static sand has exactly zero face velocities
      if (a < 0.5 && mv === 0 && Math.abs(m - this.targetMass) < 1e-4 * this.targetMass + 1) this.quiet = (this.quiet || 0) + 1;
      else this.quiet = 0;
    }
  }

  _reduce() {
    const gl = this.gl;
    // reduction passes
    let src = this.state[this.cur], sw = this.W, sh = this.H;
    for (let i = 0; i < this.red.length; i++) {
      const r = this.red[i];
      const pr = i === 0 ? this.progs.red0 : this.progs.red;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, r.f);
      gl.viewport(0, 0, r.w, r.h);
      if (i === 0) {
        this._bindTex(0, src, pr.u.uState);
        this._bindTex(1, this.aux[this.cur], pr.u.uAux);
        gl.uniform2i(pr.u.uSize, this.W, this.H);
      } else {
        this._bindTex(0, src, pr.u.uSrc);
        gl.uniform2i(pr.u.uSrcSize, sw, sh);
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      src = r.t; sw = r.w; sh = r.h;
    }
    const last = this.red[this.red.length - 1];
    const buf = this.pbos[this.pboIdx]; this.pboIdx = (this.pboIdx + 1) % this.pbos.length;
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, buf);
    gl.readPixels(0, 0, last.w, last.h, gl.RGBA, gl.FLOAT, 0);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();
    this._pending.push({ sync, buf });
  }

  render(R) {
    const gl = this.gl;
    gl.bindVertexArray(this.vao);
    // render-only sim-res textures (gradient); (re)created when the sim grid changes
    if (this._surfFor !== this.surf) {
      if (this._surf2) { gl.deleteTexture(this._surf2); gl.deleteFramebuffer(this._fSurfMRT); }
      this._surf2 = this._tex(this.W, this.H, gl.RGBA16F, gl.HALF_FLOAT, gl.LINEAR, null);
      this._fSurfMRT = this._fbo(this.surf, this._surf2);
      if (this._rough) { gl.deleteTexture(this._rough); gl.deleteFramebuffer(this._fRough); }
      this._rough = this._tex(this.W, this.H, gl.RGBA16F, gl.HALF_FLOAT, gl.NEAREST, null);
      this._fRough = this._fbo(this._rough);
      this._surfFor = this.surf;
    }
    // micro-relief of the grain packing at sim res
    {
      const pr = this.progs.rough;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this._fRough);
      gl.viewport(0, 0, this.W, this.H);
      this._bindTex(0, this.state[this.cur], pr.u.uState);
      this._simUniforms(pr, 0);
      gl.uniform1f(pr.u.uRoughAmp, (R.vis && R.vis.rough != null) ? R.vis.rough : (R.rough != null ? R.rough : 2.5));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // surf prep at sim res
    {
      const pr = this.progs.surf;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this._fSurfMRT);
      gl.viewport(0, 0, this.W, this.H);
      this._bindTex(0, this.state[this.cur], pr.u.uState);
      this._bindTex(1, this._rough, pr.u.uRoughT);
      this._simUniforms(pr, 0);
      gl.uniform3f(pr.u.uLs, R.L[0], R.L[1], R.L[2]);
      const VA = (R.vis && R.vis.ao) || [0.2, 0.06];
      gl.uniform2f(pr.u.uAO, VA[0], VA[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    {
      const pr = this.progs.render;
      gl.useProgram(pr.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, this.canvas.width, this.canvas.height);
      this._bindTex(0, this.state[this.cur], pr.u.uState);
      this._bindTex(1, this.surf, pr.u.uSurf);
      this._bindTex(2, this.aux[this.cur], pr.u.uAux);
      this._bindTex(3, this._surf2, pr.u.uSurf2);
      gl.uniform1f(pr.u.uAlbVar, (R.vis && R.vis.albVar != null) ? R.vis.albVar : (R.albVar != null ? R.albVar : 0.12));
      gl.uniform1f(pr.u.uRelief, R.relief != null ? R.relief : 0.35);
      const V = R.vis || {};
      gl.uniform1f(pr.u.uPack, V.pack != null ? V.pack : 0.56);
      gl.uniform1f(pr.u.uGrainN, V.grainN != null ? V.grainN : 0.45);
      gl.uniform1f(pr.u.uFacet, V.facet != null ? V.facet : 0.45);
      gl.uniform1f(pr.u.uGapLight, V.gapLight != null ? V.gapLight : 0.6);
      gl.uniform1f(pr.u.uMicroN, V.microN != null ? V.microN : 0.6);
      gl.uniform1i(pr.u.uDebug, V.debug | 0);
      gl.uniform1f(pr.u.uMottle, V.mottle != null ? V.mottle : 0.12);
      gl.uniform1f(pr.u.uAngular, V.angular != null ? V.angular : 0.26);
      gl.uniform1f(pr.u.uSpec, V.spec != null ? V.spec : 1.0);
      gl.uniform1f(pr.u.uDesat, V.desat != null ? V.desat : 0.4);
      gl.uniform1f(pr.u.uGrainShMin, V.grainSh != null ? V.grainSh : 0.5);
      gl.uniform2i(pr.u.uSize, this.W, this.H);
      gl.uniform2f(pr.u.uRes, this.canvas.width, this.canvas.height);
      gl.uniform1f(pr.u.uCellPx, R.cellPx);
      gl.uniform3f(pr.u.uLs, R.L[0], R.L[1], R.L[2]);
      gl.uniform3f(pr.u.uUp, R.up[0], R.up[1], R.up[2]);
      gl.uniform3fv(pr.u.uLightCol, R.lightCol);
      gl.uniform3fv(pr.u.uSkyCol, R.skyCol);
      gl.uniform1f(pr.u.uExposure, R.exposure * (R.vis && R.vis.exp != null ? R.vis.exp : 1));
      gl.uniform1f(pr.u.uGrainR, R.grainR);
      gl.uniform1f(pr.u.uEye, R.eye);
      gl.uniform3fv(pr.u.uMinCol, R.minCol);
      gl.uniform4fv(pr.u.uMinProp, R.minProp);
      gl.uniform3fv(pr.u.uMeanCol, R.meanCol);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }

  // Synchronous full readback (used for resizing / snapshots / debugging only). Returns null on failure.
  readState() {
    const gl = this.gl;
    if (!this.state || gl.isContextLost()) return null;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fState[this.cur]);
    const out = new Float32Array(this.W * this.H * 4);
    while (gl.getError() !== gl.NO_ERROR) { /* clear stale errors */ }
    gl.readPixels(0, 0, this.W, this.H, gl.RGBA, gl.FLOAT, out);
    if (gl.getError() !== gl.NO_ERROR) return null;
    return out;
  }

  get lost() { return this.gl.isContextLost(); }

  // Re-create every GL object after a WebGL context loss+restore. Old handles are dead, so just drop them;
  // the caller must re-upload the simulation with setup().
  restoreContext() {
    const gl = this.gl;
    this.state = null; this._pending = []; this.massCorr = 1;
    this.floatRT = !!gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('EXT_color_buffer_half_float');
    gl.getExtension('EXT_float_blend');
    this.stateFmt = this.floatRT ? { i: gl.RGBA32F, t: gl.FLOAT } : { i: gl.RGBA16F, t: gl.HALF_FLOAT };
    this._initGL();
  }
}

// float32 -> float16 bits (for devices without float32 render targets)
function toHalf(f32) {
  const out = new Uint16Array(f32.length);
  const fv = new Float32Array(1), iv = new Uint32Array(fv.buffer);
  for (let i = 0; i < f32.length; i++) {
    fv[0] = f32[i]; const x = iv[0];
    const s = (x >>> 16) & 0x8000; let e = ((x >>> 23) & 0xff) - 112; let m = x & 0x7fffff;
    if (e <= 0) { out[i] = s; continue; }
    if (e >= 31) { out[i] = s | 0x7bff; continue; }
    out[i] = s | (e << 10) | (m >>> 13);
  }
  return out;
}

function srgbToLin(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
}

function presetUniforms(pr) {
  const minCol = new Float32Array(18), minProp = new Float32Array(24), mean = [0, 0, 0];
  let cum = 0;
  const tot = pr.minerals.reduce((s, m) => s + m[1], 0);
  pr.minerals.forEach((m, i) => {
    const c = srgbToLin(m[0]);
    minCol.set(c, i * 3);
    cum += m[1] / tot;
    minProp.set([i === pr.minerals.length - 1 ? 1.0001 : cum, m[2], m[3], m[4]], i * 4);
    for (let k = 0; k < 3; k++) mean[k] += c[k] * m[1] / tot;
  });
  return { minCol, minProp, meanCol: mean };
}

// ---- 50_audio.js
// ============================================================================
// AUDIO: procedural granular sand sound
//   flow   - fine granular hiss: a Poisson stream of tiny grain "ticks" (short
//            damped resonances, 2-9 kHz). Sparse = trickle, dense = hiss.
//   scrape - finger plowing: lower, rougher stick-slip ticks + a crackly noise bed
//   rumble - mass of sand sliding: low-passed noise
//   thump  - impacts (sand slapping a wall after a tilt/shake): pitched-down sine
//            body + soft noise burst + a brief spray of ticks
// The DSP is one plain class (SandDSP) that runs inside an AudioWorklet (its
// source is shipped through a Blob URL) or, if worklets are unavailable, in a
// ScriptProcessorNode on the main thread.
// ============================================================================
class SandDSP {
  constructor(sr) {
    this.sr = sr;
    this.seed = 0x2545f491;
    this.tgt = { flow: 0, scrape: 0, rumble: 0, bright: 0.5 };
    this.flow = 0; this.scrape = 0; this.rumble = 0; this.bright = 0.5;
    this.kPar = 1 - Math.exp(-128 / (sr * 0.035));            // per-block parameter smoothing
    // resonator banks: 4 resonators x 2 channels each; per resonator [a1, a2, gain, y1, y2, in]
    this.fb = this._bank([2300, 3500, 5200, 7600], 0.0011);
    this.sb = this._bank([700, 1250, 2100, 3400], 0.0019);
    this.fFreq = [2300, 3500, 5200, 7600]; this.sFreq = [700, 1250, 2100, 3400];
    this.lastBright = -1;
    // noise filters
    this.r1 = 0; this.r2 = 0; this.kR = 1 - Math.exp(-2 * Math.PI * 140 / sr);
    this.n1 = 0; this.n2 = 0; this.kNh = 1 - Math.exp(-2 * Math.PI * 700 / sr); this.kNl = 1 - Math.exp(-2 * Math.PI * 3800 / sr);
    this.rough = 0; this.kRough = 1 - Math.exp(-2 * Math.PI * 30 / sr);
    // thump
    this.thAmp = 0; this.thEnv = 0; this.thAtk = 1; this.thPh = 0; this.thF = 62; this.thN = 0; this.thNz = 0;
    this.dTh = Math.exp(-1 / (sr * 0.085)); this.dThN = Math.exp(-1 / (sr * 0.045));
    this.spray = 0; this.dSpray = Math.exp(-128 / (sr * 0.12));
  }
  _bank(freqs, tau) {
    const b = [];
    for (let ch = 0; ch < 2; ch++) for (let k = 0; k < freqs.length; k++) b.push(new Float64Array(6));
    this._tune(b, freqs, tau, 1);
    b.tau = tau;
    return b;
  }
  _tune(b, freqs, tau, mul) {
    const n = freqs.length;
    for (let ch = 0; ch < 2; ch++) for (let k = 0; k < n; k++) {
      const f = Math.min(this.sr * 0.42, freqs[k] * mul * (ch ? 1.035 : 0.97));
      const w = 2 * Math.PI * f / this.sr, r = Math.exp(-1 / (this.sr * tau));
      const o = b[ch * n + k];
      o[0] = 2 * r * Math.cos(w); o[1] = -r * r; o[2] = Math.sin(w);
    }
  }
  rnd() { let x = this.seed; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; this.seed = x >>> 0; return this.seed / 4294967296; }
  set(p) { Object.assign(this.tgt, p); }
  thump(a) {
    a = Math.min(1, Math.max(0, a));
    if (a < 0.02) return;
    this.thAmp = Math.max(this.thAmp * this.thEnv, a); this.thEnv = 1; this.thAtk = 0; this.thN = 1;
    this.thF = 52 + this.rnd() * 22;
    this.spray = Math.max(this.spray, a);
  }
  _hit(b, a) {
    const k = (this.rnd() * 4) | 0, pan = this.rnd();
    b[k][5] += a * Math.sqrt(1 - pan) * b[k][2];
    b[4 + k][5] += a * Math.sqrt(pan) * b[4 + k][2];
  }
  // fills L and R (Float32Array) with n samples
  process(L, R, n) {
    const t = this.tgt, kp = this.kPar;
    this.flow += (t.flow - this.flow) * kp; this.scrape += (t.scrape - this.scrape) * kp;
    this.rumble += (t.rumble - this.rumble) * kp; this.bright += (t.bright - this.bright) * kp;
    if (Math.abs(this.bright - this.lastBright) > 0.01) {
      this._tune(this.fb, this.fFreq, this.fb.tau, 0.8 + 0.45 * this.bright);
      this._tune(this.sb, this.sFreq, this.sb.tau, 0.85 + 0.3 * this.bright);
      this.lastBright = this.bright;
    }
    this.spray *= this.dSpray;
    const sr = this.sr, fl = this.flow, sc = this.scrape, ru = this.rumble;
    // event rates (per sample)
    const fRate = (fl > 0.002 ? 60 * fl + 16000 * Math.pow(fl, 1.7) : 0) + this.spray * 9000;
    const sRate = sc > 0.002 ? 150 * sc + 4200 * Math.pow(sc, 1.3) : 0;
    const pF = Math.min(0.9, fRate / sr), pS = Math.min(0.9, sRate / sr);
    // tick amplitude: dense streams get quieter ticks so loudness grows ~ sqrt(rate)
    const aF = 0.3 * (0.18 + 0.82 * Math.sqrt(fl + this.spray * 0.5)) / Math.sqrt(1 + fRate / 400);
    const aS = 0.42 * (0.2 + 0.8 * Math.sqrt(sc)) / Math.sqrt(1 + sRate / 300);
    const gBed = sc * 0.08, gRum = ru * 0.35;
    const fb = this.fb, sb = this.sb;
    for (let i = 0; i < n; i++) {
      if (pF > 0 && this.rnd() < pF) { const u = this.rnd(); this._hit(fb, aF * (0.2 + 1.6 * u * u * u) * (this.rnd() < 0.5 ? -1 : 1)); }
      if (pS > 0 && this.rnd() < pS) { const u = this.rnd(); this._hit(sb, aS * (0.2 + 1.8 * u * u * u) * (this.rnd() < 0.5 ? -1 : 1)); }
      let l = 0, r = 0;
      for (let k = 0; k < 8; k++) {
        let o = fb[k]; let y = o[5] + o[0] * o[3] + o[1] * o[4]; o[4] = o[3]; o[3] = y; o[5] = 0;
        let ys = y;
        o = sb[k]; y = o[5] + o[0] * o[3] + o[1] * o[4]; o[4] = o[3]; o[3] = y; o[5] = 0;
        ys += y;
        if (k < 4) l += ys; else r += ys;
      }
      // white noise source shared by the beds
      const w = this.rnd() * 2 - 1;
      // scrape bed: band-limited noise with a crackly roughness envelope
      this.rough += ((this.rnd() * 2 - 1) - this.rough) * this.kRough;
      this.n1 += (w - this.n1) * this.kNh; const hp = w - this.n1;
      this.n2 += (hp - this.n2) * this.kNl;
      const bed = this.n2 * gBed * (0.3 + 6 * Math.abs(this.rough));
      // rumble
      this.r1 += (w - this.r1) * this.kR; this.r2 += (this.r1 - this.r2) * this.kR;
      const rum = this.r2 * gRum * 9;
      // thump
      let th = 0;
      if (this.thEnv > 1e-4) {
        this.thAtk = Math.min(1, this.thAtk + 1 / (0.004 * sr));
        this.thPh += 2 * Math.PI * this.thF * (1 + 0.7 * this.thEnv) / sr;
        if (this.thPh > 6.283185307) this.thPh -= 6.283185307;
        this.thNz += (w - this.thNz) * 0.03;
        th = (Math.sin(this.thPh) * this.thEnv * 0.9 + this.thNz * this.thN * 2.2) * this.thAtk * this.thAmp;
        this.thEnv *= this.dTh; this.thN *= this.dThN;
      }
      let xl = l + bed + rum + th, xr = r + bed * 0.9 + rum + th;
      L[i] = xl / Math.sqrt(1 + xl * xl);
      R[i] = xr / Math.sqrt(1 + xr * xr);
    }
  }
}

class SandAudio {
  constructor() { this.ctx = null; this.enabled = true; this.node = null; this.dsp = null; this.volume = 1.0; this._last = ''; }

  // Must be called from inside a user gesture (touchend / click / keydown) at least once.
  unlock() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    // iOS 17+: mix with the user's music and respect the silent switch
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { this.ctx = new AC(); } catch (e2) { return; } }
    const ctx = this.ctx;
    // play one silent sample inside the gesture (older iOS needs this to unmute WebAudio)
    try { const b = ctx.createBuffer(1, 1, ctx.sampleRate); const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) {}
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);
    this._fadeTo(this.enabled ? this.volume : 0, 0.25);
    this._build();
  }

  async _build() {
    const ctx = this.ctx;
    if (ctx.audioWorklet && window.AudioWorkletNode && window.Blob && window.URL) {
      const src = SandDSP.toString() + `
class SandProc extends AudioWorkletProcessor {
  constructor() { super(); this.d = new SandDSP(sampleRate); this.port.onmessage = (e) => { const m = e.data; if (m.thump) this.d.thump(m.thump); else this.d.set(m); }; }
  process(inp, out) { const o = out[0]; if (!o || !o[0]) return true; this.d.process(o[0], o[1] || o[0], o[0].length); return true; }
}
registerProcessor('sand-proc', SandProc);`;
      try {
        const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        this.node = new AudioWorkletNode(ctx, 'sand-proc', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
        this.node.connect(this.master);
        this.post = (m) => this.node.port.postMessage(m);
        return;
      } catch (e) { /* fall through to ScriptProcessor */ }
    }
    try {
      const dsp = new SandDSP(ctx.sampleRate);
      const sp = ctx.createScriptProcessor(2048, 0, 2);
      sp.onaudioprocess = (e) => { const ob = e.outputBuffer; dsp.process(ob.getChannelData(0), ob.getChannelData(1), ob.length); };
      sp.connect(this.master);
      this.node = sp; this.dsp = dsp;
      this.post = (m) => { if (m.thump) dsp.thump(m.thump); else dsp.set(m); };
    } catch (e) { /* no audio */ }
  }

  _fadeTo(v, tau) {
    if (!this.master) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    try { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); } catch (e) {}
    g.setTargetAtTime(v, t, tau);
  }

  setEnabled(on) { this.enabled = on; this._fadeTo(on ? this.volume : 0, 0.06); }

  // page hidden / shown: fade out then suspend so nothing pops, and stop burning CPU
  suspend() {
    if (!this.ctx || this.ctx.state !== 'running') return;
    this._fadeTo(0, 0.02);
    const ctx = this.ctx;
    setTimeout(() => { if (document.hidden) ctx.suspend().catch(() => {}); }, 120);
  }
  resume() {
    if (!this.ctx || this.ctx.state === 'closed' || document.hidden) return;
    const go = () => this._fadeTo(this.enabled ? this.volume : 0, 0.2);
    if (this.ctx.state !== 'running') this.ctx.resume().then(go, () => {}); else go();
  }

  get running() { return !!(this.ctx && this.ctx.state === 'running' && this.post); }

  // flow: flowing surface (0..1), scrape: finger plowing (0..1), rumble: bulk sliding (0..1), bright: 0..1 (grain size/colour)
  update(flow, scrape, rumble, bright = 0.5) {
    if (!this.running) return;
    const q = (v) => Math.round(Math.min(1, Math.max(0, v)) * 1000) / 1000;
    const m = { flow: q(flow), scrape: q(scrape), rumble: q(rumble), bright: q(bright) };
    const key = m.flow + ',' + m.scrape + ',' + m.rumble + ',' + m.bright;
    if (key === this._last) return;
    this._last = key;
    this.post(m);
  }
  thump(a) { if (this.running && this.enabled) this.post({ thump: a }); }
}

// ============================================================================
// APP: world setup, sensors, touch, light, UI, main loop
// ============================================================================
(function () {
  const qs = new URLSearchParams(location.search);
  const TEST = qs.has('test');
  const DEBUG = qs.has('debug');
  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const stage = $('stage');

  // ---------------- physical scale ----------------
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
  const isDesktop = !isTouch || matchMedia('(hover: hover) and (pointer: fine)').matches;

  const GRAIN_MM = 0.36;

  const app = {
    preset: 'beach', tool: 'finger', sound: true,
    rot: 0, natW: 0, natH: 0, cellCss: 2.2, cellMm: GRAIN_MM, simW: 0, simH: 0,
    renderScale: 1, dpr: Math.min(window.devicePixelRatio || 1, 3),
    // sensors
    motion: false, aSign: 0, signVotes: 0,
    gRaw: [0, 0, -9.81], gFilt: [0, 0, -9.81], gSlow: [0, 0, -9.81], hpEnergy: 0, lastMotion: 0,
    orient: null,
    virtTilt: [0, 0], virtShake: [0, 0, 0],
    started: false,
    // layout: tray = simulated area in CSS px of the natural frame; vw/vh = viewport the layout was computed for
    trayW: 0, trayH: 0, screenMode: false, vw: 0, vh: 0,
    motionState: 'unknown'
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sand.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sand.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  if (!TEST) {
    const p = store.get('preset', app.preset); if (PRESETS[p]) app.preset = p;
    const t = store.get('tool', app.tool); if (['finger', 'rake', 'pour'].includes(t)) app.tool = t;
    app.sound = store.get('sound', true) !== false;
  }
  let engine;
  try { engine = new SandEngine(canvas); }
  catch (e) { showFatal(e.message); return; }
  const audio = new SandAudio();
  audio.enabled = app.sound;
  window.SAND = { app, engine, audio };

  function showFatal(msg) {
    const f = $('fatal'); f.textContent = msg + ' Try a recent version of Safari or Chrome.'; f.style.display = 'flex';
    ['menuBtn', 'hint'].forEach(id => { const el = $(id); if (el) el.style.display = 'none'; });
  }

  // ---------------- layout & orientation ----------------
  // The tray lives in the device's NATURAL frame (= the motion-sensor frame) and never turns with the UI:
  // when the browser rotates the page, the canvas is counter-rotated with CSS. On phones and tablets the
  // tray is the whole physical screen, so rotation, browser bars and the iOS URL bar never resize (or wipe)
  // the simulation: the viewport is just a window onto the tray, centred on it. The tray is only
  // reallocated on real size changes (desktop window resize, split view), preserving the sand.
  function screenAngle() {
    let a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle
      : (typeof window.orientation === 'number' ? window.orientation : 0);
    a = ((Math.round(a / 90) * 90 % 360) + 360) % 360;
    return a;
  }

    const vw = window.innerWidth, vh = window.innerHeight;

    if (v.nw > sw + 4 || v.nh > sh + 4 || v.nw < 0.6 * sw || v.nh < 0.6 * sh) return null;

    // (If they never agree - odd devices - go ahead after 700 ms.)
    if (app.simW && app.screenMode && Math.abs(v.nw - v.nh) > 40 && (v.nh > v.nw) !== (app.natH > app.natW)) {
      if (!layoutBlockedSince) layoutBlockedSince = performance.now();
      if (performance.now() - layoutBlockedSince < 700) return;

      const now = performance.now();
      if (!pendingTray || Math.abs(pendingTray.w - t.w) > 2 || Math.abs(pendingTray.h - t.h) > 2) pendingTray = Object.assign({ since: now }, t);
      else if (now - pendingTray.since > 350) { pendingTray = null; resizeTray(t); }

    canvas.style.transform = `translate(${(v.vw - app.natW) / 2}px, ${(v.vh - app.natH) / 2}px)` + (v.a ? ` rotate(${-v.a}deg)` : '');

  }
  function setupSim(t) {
    let cellCss = baseCellCss(t.w, t.h);

    cellCss = t.w / W; // exact fit horizontally
    const H = Math.max(16, Math.round(t.h / cellCss));

    app.renderScale = Math.min(1, Math.max(0.5, Math.sqrt(3.4e6 / (app.natW * app.natH * app.dpr * app.dpr))));
    const st = generateWorld(W, H, app.started ? null : 'intro');
    engine.setup(W, H, st.state, st.aux);

    const P = physicsParams(1 / 60, true);
    for (let i = 0; i < (TEST ? 30 : 45); i++) engine.simulate(1 / 60, P, { segs: [] });
  }
  // Real size change: keep the sand where it physically is (crop / pad around the centre). The cell size is
  // only changed when the cell budget requires it; heights are converted so the physical depth is kept.
  function resizeTray(t) {
    const old = engine.readState();
    const oW = app.simW, oH = app.simH, oCell = app.cellCss;
