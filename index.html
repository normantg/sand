    // rotate by the device rotation since the reference (a -> b), Rodrigues
    const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const c = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross = (p, q) => [p[1] * q[2] - p[2] * q[1], p[2] * q[0] - p[0] * q[2], p[0] * q[1] - p[1] * q[0]];
    const vx = cross(v, L0), vxx = cross(v, vx), f = 1 / Math.max(1 + c, 1e-3);
    let L = [0, 1, 2].map(i => L0[i] + vx[i] + vxx[i] * f);
    // light grazing or behind the screen plane: the device shadows the sand; keep a usable direction, dim the key
    const minZ = 0.26;
    const key = 0.3 + 0.7 * Math.min(1, Math.max(0, (L[2] + 0.3) / (minZ + 0.3)));
    if (L[2] < minZ) {
      const hl = Math.hypot(L[0], L[1]) || 1, s2 = Math.sqrt(1 - minZ * minZ);
      L = [L[0] / hl * s2, L[1] / hl * s2, minZ];
    }
    const ln = Math.hypot(...L); L = L.map(q => q / ln);
    const Ls = [L[0], -L[1], L[2]], ups = [b[0], -b[1], b[2]];
    const k = TEST ? 1 : 1 - Math.exp(-dt / 0.15);
    for (let i = 0; i < 3; i++) { light.L[i] += (Ls[i] - light.L[i]) * k; light.up[i] += (ups[i] - light.up[i]) * k; }
    light.key += (key - light.key) * k;
    const ln2 = Math.hypot(...light.L) || 1; light.L = light.L.map(q => q / ln2);
  }

  // ---------------- UI ----------------
  const hintEl = $('hint');
  let hintTimer = 0;
  function showHint() {
    if (TEST) return;
    if (isDesktop) hintEl.innerHTML = 'drag to draw · <kbd>shift</kbd>+drag or arrows to tilt · <kbd>space</kbd> to shake';
    else hintEl.textContent = 'tap  ···  for sands & tools';
    setTimeout(() => hintEl.classList.add('show'), 900);
    hintTimer = setTimeout(() => hintEl.classList.remove('show'), isDesktop ? 16000 : 7000);
  }
  function hideHint() {
    if (app.started) return;
    app.started = true;
    if (!isDesktop) { clearTimeout(hintTimer); hintEl.classList.remove('show'); }
  }
  function usedTilt() { if (isDesktop) { clearTimeout(hintTimer); hintEl.classList.remove('show'); } }
  function toast(msg, ms = 4200) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), ms);
  }
  function setPanel(open) {
    document.body.classList.toggle('panel-open', open);
    $('menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) updatePanel();
  }
  function markTool() {
    const bs = [...document.querySelectorAll('[data-tool]')];
    const i = Math.max(0, bs.findIndex(b => b.dataset.tool === app.tool));
    bs.forEach((b, k) => b.classList.toggle('on', k === i));
    const pill = document.querySelector('#tools .pill');
    pill.style.width = `calc((100% - 6px) / ${bs.length})`;
    pill.style.transform = `translateX(${i * 100}%)`;
  }
  function updatePanel() {
    const sb = $('soundBtn');
    sb.classList.toggle('off', !app.sound);
    sb.setAttribute('aria-pressed', app.sound ? 'true' : 'false');
    sb.querySelector('.w').style.display = app.sound ? '' : 'none';
    sb.querySelector('.x').style.display = app.sound ? 'none' : '';
    sb.querySelector('b').textContent = app.sound ? 'Sound' : 'Muted';
    const tb = $('tiltBtn');
    const showTilt = isTouch && needsMotionPermission && !app.motion;
    tb.style.display = showTilt ? '' : 'none';
    tb.classList.toggle('warn', app.motionState === 'denied');
    const fs = $('fsBtn'), el = document.documentElement;
    const canFs = !isStandalone && !!(el.requestFullscreen || el.webkitRequestFullscreen) && !isIOS;
    fs.style.display = canFs ? '' : 'none';
    const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fs.lastChild.textContent = inFs ? 'Exit full screen' : 'Full screen';
    const note = $('note');
    if (isIOS && !isStandalone) { note.innerHTML = 'For the real thing, tap Share&nbsp;› <b>Add to Home Screen</b>. Sand then opens edge to edge, without browser bars.'; note.style.display = 'block'; }
    else if (isDesktop) { note.innerHTML = 'Drag to draw · <b>shift</b>-drag, right-drag or arrow keys to tilt · <b>space</b> to shake'; note.style.display = 'block'; }
    else note.style.display = 'none';
  }
  function buildUI() {
    const sw = $('sands');
    Object.entries(PRESETS).forEach(([k, p]) => {
      const b = document.createElement('button');
      b.className = 'sand' + (k === app.preset ? ' on' : '');
      b.setAttribute('aria-label', p.name);
      b.innerHTML = `<i style="background:radial-gradient(circle at 35% 30%, ${p.swatch[0]}, ${p.swatch[1]})"></i><span>${p.name}</span>`;
      b.onclick = () => { setPreset(k); store.set('preset', k); document.querySelectorAll('.sand').forEach(x => x.classList.toggle('on', x === b)); };
      sw.appendChild(b);
    });
    document.querySelectorAll('[data-tool]').forEach(b => {
      b.onclick = () => { app.tool = b.dataset.tool; store.set('tool', app.tool); markTool(); };
    });
    markTool();
    $('menuBtn').onclick = (e) => { e.stopPropagation(); setPanel(!document.body.classList.contains('panel-open')); };
    // tapping the sand while the sheet is open just closes it (the touch never reaches the sand)
    const scrim = $('scrim');
    scrim.addEventListener('pointerdown', (e) => { e.preventDefault(); setPanel(false); });
    $('panel').addEventListener('pointerdown', (e) => e.stopPropagation());
    $('soundBtn').onclick = () => {
      app.sound = !app.sound; store.set('sound', app.sound);
      if (app.sound) audio.unlock();
      audio.setEnabled(app.sound);
      updatePanel();
    };
    $('tiltBtn').onclick = () => {
      if (app.motion) return;
      requestMotion(true);
      if (app.motionState === 'granted') setTimeout(() => { if (!app.motion) toast('No motion data from this device yet. Tilt needs a phone or tablet with motion sensors.'); }, 1500);
    };
    $('smoothBtn').onclick = () => { smoothUntil = performance.now() + 1400; wake(); setPanel(false); };
    $('refillBtn').onclick = () => { refill(); setPanel(false); };
    const el = document.documentElement;
    $('fsBtn').onclick = () => {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (req) {
        try {
          Promise.resolve(req.call(el, { navigationUI: 'hide' })).then(() => {
            // keep the UI from rotating: the sand never rotates anyway
            try { screen.orientation.lock('natural').catch(() => {}); } catch (e) {}
          }).catch(() => {});
        } catch (e) {}
      }
      setPanel(false);
    };
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, updatePanel));
    updatePanel();
  }
  function setPreset(k) { app.preset = k; ui = presetUniforms(PRESETS[k]); wake(); }
  function refill() {
    const st = generateWorld(app.simW, app.simH, null);
    engine.setup(app.simW, app.simH, st.state, st.aux);
    const P = physicsParams(1 / 60, true);
    for (let i = 0; i < 20; i++) engine.simulate(1 / 60, P, { segs: [] });
    wake();
  }
  let smoothUntil = 0;
  let ui = presetUniforms(PRESETS[app.preset]);

  // ---------------- main loop ----------------
  let last = performance.now(), running = false, rafId = 0;
  const fpsEl = $('fps');
  let fpsAcc = 0, fpsN = 0;
  // Idle: once the sand is at rest and nothing touches or moves the phone, stop simulating and only redraw
  // when the light (phone attitude) changes. Saves battery and keeps the phone cool.
  let asleep = false, quietFrames = 0, sleepG = [0, 0, -9.81], needDraw = true;
  const lastL = [0, 0, 0];
  function wake() { asleep = false; quietFrames = 0; needDraw = true; }
  function frame(now) {
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 1 / 60;
    const rawDt = dt;
    dt = Math.min(dt, 1 / 30); // after a stall, never take one huge physics step
    if (layoutKey() !== lastLayoutKey || pendingTray) layout();
    if (engine.lost) { if (lostAt && performance.now() - lostAt > 5000) location.reload(); return; }
    if (!app.simW) return;
    if (asleep) {
      const g = effectiveGravity();
      if (pointers.size || keys.size || performance.now() < smoothUntil || app.hpEnergy > 0.6 ||
          Math.hypot(g[0] - sleepG[0], g[1] - sleepG[1], g[2] - sleepG[2]) > 0.35) wake();
    }
    const sim = !asleep;
    const drew = step(dt, sim, sim || needDraw);
    if (sim) restCheck();
    adaptQuality(rawDt, sim && drew);
    if (DEBUG) {
      fpsAcc += rawDt; fpsN++;
      if (fpsN >= 20) {
        fpsEl.textContent = `${(fpsN / fpsAcc).toFixed(0)} fps · ${app.simW}×${app.simH} · rs ${app.renderScale.toFixed(2)} · ${asleep ? 'idle' : 'run'} · m ${engine.stats.mass.toFixed(0)}\nact ${(engine.stats.activity / (app.simW * app.simH)).toFixed(3)} mov ${engine.stats.moving} · g ${app.gFilt.map(v => v.toFixed(1)).join(',')} · sign ${app.aSign} · ${app.motionState}`;
        fpsAcc = 0; fpsN = 0;
      }
    }
  }
  function restCheck() {
    const st = engine.stats, area = app.simW * app.simH;
    const quiet = !TEST && pointers.size === 0 && keys.size === 0 && performance.now() >= smoothUntil && app.hpEnergy < 0.6 &&
      Math.hypot(...app.virtShake) < 0.3 && st.valid && st.moving <= 2 && st.activity < area * 0.01;
    quietFrames = quiet ? quietFrames + 1 : 0;
    if (quietFrames > 45) { asleep = true; sleepG = effectiveGravity().slice(); }
  }

  // Adaptive render resolution. Measures fps over 1 s windows; lowers the scale when < 48 fps, but undoes
  // the change if it did not help (iOS Low Power Mode caps rAF at 30 Hz; CPU-bound frames); raises it again
  // after sustained headroom, and remembers a ceiling when raising caused a drop (no oscillation).
  // 120 Hz displays simply measure > 57 fps and are left alone.
  const q = { n: 0, acc: 0, probe: null, ceiling: 1, lock: 0, cool: 3, good: 0, fails: 0 };
  function setScale(s) { app.renderScale = Math.min(1, Math.max(0.5, s)); resizeCanvas(); }
  function adaptQuality(rawDt, rendered) {
    if (TEST) return;
    if (!rendered || rawDt > 0.25) { q.n = 0; q.acc = 0; return; } // idle or stalled: window is meaningless
    q.n++; q.acc += rawDt;
    if (q.acc < 1) return;
    const fps = q.n / q.acc; q.n = 0; q.acc = 0;
    q.lock--; q.cool--;
    if (q.probe) {
      if (--q.probe.wait > 0) return;
      const p = q.probe; q.probe = null;
      if (p.dir < 0 && fps < p.fps * 1.1) { setScale(p.scale); q.fails++; q.lock = 20 << Math.min(q.fails, 4); }
      else if (p.dir > 0 && fps < 52) { setScale(p.scale); q.ceiling = p.scale; q.cool = 120; }
      else if (p.dir > 0) q.cool = 4;
      return;
    }
    q.good = fps > 57 ? q.good + 1 : 0;
    if (fps < 48 && app.renderScale > 0.501 && q.lock <= 0) {
      q.probe = { dir: -1, scale: app.renderScale, fps, wait: 2 };
      setScale(app.renderScale * 0.85);
    } else if (q.good >= 6 && app.renderScale < q.ceiling - 0.01 && q.cool <= 0) {
      q.probe = { dir: 1, scale: app.renderScale, fps, wait: 3 };
      setScale(Math.min(q.ceiling, app.renderScale / 0.85));
      q.good = 0;
    }
  }

  function inputTick(dt) {
    if (app.motion) return;
    // keyboard virtual tilt: the arrow pushes the sand that way
    const k = 1.2 * dt;
    if (keys.has('ArrowLeft')) app.virtTilt[0] -= k;
    if (keys.has('ArrowRight')) app.virtTilt[0] += k;
    if (keys.has('ArrowUp')) app.virtTilt[1] -= k;
    if (keys.has('ArrowDown')) app.virtTilt[1] += k;
    app.virtTilt = app.virtTilt.map(v => Math.max(-1.2, Math.min(1.2, v)));
    // let go and the tray settles back level (not in test mode: scenarios set a fixed tilt)
    let holding = keys.size > 0;
    for (const p of pointers.values()) if (p.tilt) holding = true;
    if (!TEST && !holding) app.virtTilt = app.virtTilt.map(v => Math.abs(v) < 2e-3 ? 0 : v * Math.exp(-dt / 0.9));
    app.virtShake = app.virtShake.map(v => v * Math.exp(-dt / 0.08));
    const vs = Math.hypot(...app.virtShake);
    app.hpEnergy += (vs * vs - app.hpEnergy) * (1 - Math.exp(-dt / 0.25));
  }

  // returns true if a frame was drawn
  function step(dt, sim = true, force = true) {
    inputTick(dt);
    let contacts = { segs: [], pour: null, plowSpeed: 0 };
    if (sim) {
      const P = physicsParams(dt, false);
      if (performance.now() < smoothUntil) { P.fluid = 0.85; P.kick = 90; }
      contacts = buildContacts(dt);
      engine.simulate(dt, P, contacts);
    }
    updateLight(dt);
    // idle: redraw only when the light moved noticeably (sparkles follow the phone's attitude)
    const dL = Math.hypot(light.L[0] - lastL[0], light.L[1] - lastL[1], light.L[2] - lastL[2]);
    if (!force && dL < 0.003) { sound(dt, contacts, sim); return false; }
    lastL[0] = light.L[0]; lastL[1] = light.L[1]; lastL[2] = light.L[2]; needDraw = false;
    const pr = PRESETS[app.preset];
    engine.render({
      L: light.L, up: light.up, cellPx: canvas.width / app.simW,
      lightCol: [2.55 * light.key, 2.4 * light.key, 2.15 * light.key], skyCol: [0.42, 0.43, 0.46], exposure: pr.exposure || 1.0,
      grainR: pr.grain, eye: 300 / app.cellMm, albVar: pr.albVar, relief: pr.relief, rough: pr.rough, vis: window.SAND.vis ? Object.assign({}, pr.vis, window.SAND.vis) : (pr.vis || {}),
      minCol: ui.minCol, minProp: ui.minProp, meanCol: ui.meanCol
    });
    sound(dt, contacts, sim);
    return true;
  }

  // ---------------- audio + haptics ----------------
  const snd = { fast: 0, slow: 0, lastHit: 0 };
  function sound(dt, contacts, simulated) {
    const st = engine.stats;
    const area = app.simW * app.simH;
    let act = 0, scrape = 0, rumble = 0;
    if (simulated && st.valid) {
      // activity = sum of min(h,3)*speed: ~1/cell for a trickle, ~30 moderate, ~200 a whole tray sliding, ~700 shaken
      act = Math.min(1, Math.log(1 + st.activity / area / 2) / Math.log(301));
      // plow = mass displaced by fingers this frame (~400-1500 while dragging briskly)
      scrape = Math.min(1, Math.sqrt(st.plow / 1500)) * (0.5 + 0.5 * Math.min(1, contacts.plowSpeed / 400));
      rumble = Math.min(1, st.moving / area * 1.2) * 0.7;
    }
    const pr = PRESETS[app.preset];
    const bright = Math.min(1, Math.max(0, 0.5 + (1 - (pr.grain || 1)) * 2));
    audio.update(act, scrape, rumble, bright);
    // impacts: flowing sand that suddenly stops (hits the wall / a pile) -> thump + a subtle buzz on Android
    snd.fast += (act - snd.fast) * (1 - Math.exp(-dt / 0.03));
    snd.slow += (act - snd.slow) * (1 - Math.exp(-dt / 0.2));
    const now = performance.now();
    if (simulated && snd.slow > 0.3 && snd.slow - snd.fast > 0.25 * snd.slow && now - snd.lastHit > 200) {
      const a = Math.min(1, (snd.slow - snd.fast) * 3);
      audio.thump(a);
      buzz(a);
      snd.lastHit = now;
    }
  }
  // Android only: iOS Safari has no vibration API (and we don't fake it)
  function buzz(a) {
    if (!navigator.vibrate || !app.motion || a < 0.15) return;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    try { navigator.vibrate(Math.round(6 + 14 * a)); } catch (e) {}
  }

  // ---------------- lifecycle ----------------
  function startLoop() {
    if (running || TEST || document.hidden) return;
    running = true; last = performance.now(); wake();
    rafId = requestAnimationFrame(frame);
  }
  function stopLoop() { running = false; cancelAnimationFrame(rafId); }
  // WebGL context loss (iOS does this to background tabs under memory pressure): keep a snapshot of the
  // sand taken when the page was hidden, rebuild all GPU objects on restore and put the sand back.
  let snapshot = null, lostAt = 0;
  function takeSnapshot() {
    if (engine.lost || !app.simW) return;
    const d = engine.readState();
    if (d) snapshot = { W: app.simW, H: app.simH, d };
  }
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lostAt = performance.now(); pointers.clear(); }, false);
  canvas.addEventListener('webglcontextrestored', () => {
    try {
      engine.restoreContext();
      let st;
      if (snapshot && snapshot.W === app.simW && snapshot.H === app.simH) {
        const aux = new Float32Array(snapshot.d.length);
        for (let i = 1; i < aux.length; i += 4) aux[i] = 0.55;
        st = { state: snapshot.d, aux };
      } else st = generateWorld(app.simW, app.simH, null);
      engine.setup(app.simW, app.simH, st.state, st.aux);
      lostAt = 0; wake();
    } catch (err) { location.reload(); }
  }, false);
  function onHidden() { stopLoop(); pointers.clear(); keys.clear(); audio.suspend(); takeSnapshot(); }
  function onVisible() { if (!booted) return; if (engine.lost) lostAt = performance.now(); audio.resume(); startLoop(); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) onHidden(); else onVisible(); });
  window.addEventListener('pagehide', onHidden);
  window.addEventListener('pageshow', () => { if (!document.hidden) onVisible(); });

  // ---------------- boot ----------------
  buildUI();
  let booted = false;
  const boot = () => {
    if (booted) return;
    booted = true;
    layout();
    const relayout = () => layout();
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', relayout);
    if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', relayout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    showHint();
    setTimeout(() => $('menuBtn').classList.add('idle'), 6000);
    startLoop();
    if (!TEST && location.protocol === 'https:' && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  };
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load('700 40px Caveat'), new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
  } else boot();

  // ---------------- test / debug API ----------------
  Object.assign(window.SAND, {
    step: (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) step(dt); },
    setTilt: (x, y) => { app.virtTilt = [x, y]; },
    shake: (v) => { app.virtShake = v; },
    setPreset, refill, layout, toNatural, remapState, setPanel, toast,
    pointerDown: (id, x, y, r) => pointers.set(id, { pts: [[x, y]], last: [x, y], r: r || fingerRadiusCells({}), dir: [1, 0], tilt: false, moved: 0 }),
    pointerMove: (id, x, y) => { const p = pointers.get(id); if (!p) return; const lp = p.pts[p.pts.length - 1]; const d = Math.hypot(x - lp[0], y - lp[1]); if (d > 0.01) { p.dir = [(x - lp[0]) / d, (y - lp[1]) / d]; } p.pts.push([x, y]); },
    pointerUp: (id) => pointers.delete(id),
    setTool: (t) => { app.tool = t; },
    hideHint, _pointers: pointers
  });
  Object.defineProperty(window.SAND, 'asleep', { get: () => asleep });
})();

</script>
</body>
</html>
